name: lint

# Checks on every push and pull request: shell syntax, ShellCheck, and the bats
# unit tests over the script's argument parsing and helpers. No host is touched —
# the tests source the script (its `main` is guarded) without running it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bash syntax check
        run: bash -n harden.sh

      - name: ShellCheck
        run: shellcheck harden.sh
      # The e2e harness (verify / audit / scenarios / attacks ...) is ~4,000
      # lines of bash that decide whether the hardening PASSES - a bug there
      # is a check that silently stops checking. Warnings and errors only:
      # the style notes (SC2015 `a && b || c`, SC2016 single-quoted $) are
      # the suite's deliberate idiom.
      - name: ShellCheck (test harness)
        run: shellcheck -S warning test/*.sh

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Unit tests (bats)
        run: bats test/
