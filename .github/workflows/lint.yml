name: lint

# Checks on every push and pull request: shell syntax, ShellCheck, and the bats
# unit tests over the script's argument parsing and helpers. No host is touched —
# the tests source the script (its `main` is guarded) without running it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bash syntax check
        run: bash -n harden.sh

      - name: ShellCheck
        run: shellcheck harden.sh

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Unit tests (bats)
        run: bats test/
