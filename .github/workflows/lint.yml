name: lint

# Static checks on every push and pull request: shell syntax + ShellCheck.
# No host is touched — these only analyse the script.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bash syntax check
        run: bash -n harden.sh

      - name: ShellCheck
        run: shellcheck harden.sh
