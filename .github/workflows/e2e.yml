name: e2e

# The real proof: boot a disposable Debian "server" (systemd container), run
# harden.sh inside it for real, run it again to prove idempotence, then verify
# every promise from the outside over SSH. Linting checks the script parses;
# this checks it actually hardens.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harden-and-verify:
    name: Harden a disposable Debian node + verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Boot the test node
        run: ./test/node.sh up && ./test/node.sh wait

      # CIS 6.1 offenders planted BEFORE hardening: a world-writable file, an
      # orphan owned by a UID that doesn't exist, and a 777 dir without the
      # sticky bit. The file-permissions sweeps must fix all three — verify's
      # checks flip from red to green because of these, not by vacuum.
      - name: Plant file-permission offenders for the first pass to fix
        run: |
          docker exec db-harden-node bash -c "
            install -d -m 777 /usr/local/share/dh-ww-dir &&
            touch /usr/local/share/dh-ww-file && chmod 666 /usr/local/share/dh-ww-file &&
            touch /usr/local/share/dh-orphan && chown 12345:12345 /usr/local/share/dh-orphan"

      # CIS 5.4.2 / 6.2.9 offender: a service account with a REAL shell and a
      # usable password — exactly what a packaged daemon leaves behind, and a
      # valid su / SSH target. The system-accounts step must take both away,
      # so verify's checks flip from red to green because of this account.
      - name: Plant a system account with a login shell for step 25 to lock
        run: |
          docker exec db-harden-node bash -c "
            useradd --system --shell /bin/bash --create-home dhsvc &&
            echo 'dhsvc:Plant3d!Svc#2026' | chpasswd"

      # CIS 4.2.3 offenders: a world-readable log file, and rsyslog.conf's own
      # FileCreateMode drifted to 0644 (one careless edit away on any box).
      # The log-permissions step must sweep the file to 0640 AND re-impose
      # 0640 on newly created logs via its drop-in — verify deletes syslog and
      # proves the reborn file's mode, so this flips red to green for real.
      - name: Plant log-permission offenders for step 26 to fix
        run: |
          docker exec db-harden-node bash -c "
            touch /var/log/dh-app.log && chmod 666 /var/log/dh-app.log &&
            sed -i 's/^\\\$FileCreateMode 0640/\\\$FileCreateMode 0644/' /etc/rsyslog.conf"

      # CIS 4.4 offender: a logrotate snippet that re-creates its log 0666.
      # Stock Debian already offends on its own (bare global create, dpkg and
      # alternatives at 644) — this one is the evergreen guarantee should the
      # distro ever clean up: the logrotate-perms step must tighten it to
      # 0640 while keeping the owner/group arguments untouched.
      - name: Plant a logrotate offender for step 27 to tighten
        run: |
          docker exec db-harden-node bash -c "
            touch /var/log/dh-rotated.log &&
            printf '/var/log/dh-rotated.log {\n  weekly\n  rotate 2\n  create 0666 root adm\n}\n' > /etc/logrotate.d/dh-rotated"

      # CIS 6.2 offender: an interactive user whose home is 755 — the default
      # many distros still ship — carrying the two legacy dotfiles that grant
      # access with no password (.netrc holds cleartext logins, .forward
      # reroutes mail). The home-permissions step must tighten the mode AND
      # remove both relics — verify's checks flip from red to green for real.
      - name: Plant a loose interactive home for step 29 to tighten
        run: |
          docker exec db-harden-node bash -c "
            useradd --create-home --shell /bin/bash dhhome &&
            chmod 755 /home/dhhome &&
            printf 'machine example.com login dh password hunter2\n' > /home/dhhome/.netrc &&
            printf 'dh@elsewhere.example\n' > /home/dhhome/.forward &&
            chown dhhome:dhhome /home/dhhome/.netrc /home/dhhome/.forward"

      # Step 30 offender: /proc mounted WITHOUT hidepid (the stock state) and
      # ptrace_scope forced back to 0. The second half matters — this WSL /
      # runner kernel already ships ptrace_scope=1, so without planting the 0
      # the check would pass without the step doing anything (tautological).
      - name: Plant open process visibility for step 30 to close
        run: |
          docker exec db-harden-node bash -c "
            mount -o remount,hidepid=0 /proc &&
            sysctl -qw kernel.yama.ptrace_scope=0 &&
            findmnt -no OPTIONS /proc &&
            sysctl -n kernel.yama.ptrace_scope"

      - name: "First pass: run harden.sh inside the node (as root)"
        run: |
          docker exec db-harden-node bash /root/harden.sh \
            --admin-user opsadmin \
            --pubkey "$(cat test/.ssh_ci/id_ci.pub)" -y

      - name: "Second pass: idempotence (config files must not change)"
        run: |
          files="/etc/ssh/sshd_config.d/99-hardening.conf /etc/fail2ban/jail.local /etc/apt/apt.conf.d/20auto-upgrades /etc/sysctl.d/99-hardening.conf /etc/login.defs /etc/default/useradd /etc/fstab /etc/issue /etc/issue.net /etc/motd /etc/ssh/sshd_config.d/98-banner.conf /etc/sudoers.d/99-hardening-sudo /etc/ssh/sshd_config.d/97-hardening-policies.conf /etc/security/limits.d/99-hardening-coredumps.conf /etc/systemd/coredump.conf.d/99-hardening.conf /etc/profile.d/99-hardening-umask.sh /etc/profile.d/99-hardening-tmout.sh /etc/cron.allow /etc/security/pwquality.conf /etc/aide/hardening.conf /etc/systemd/system/aide-check.timer /etc/default/rkhunter /etc/systemd/system/rkhunter-check.timer /etc/modprobe.d/99-hardening-blacklist.conf /etc/security/faillock.conf /etc/pam.d/su /etc/passwd /etc/rsyslog.d/99-hardening.conf /etc/logrotate.conf /etc/logrotate.d/dpkg /etc/logrotate.d/dh-rotated /etc/audit/rules.d/hardening.rules /etc/audit/auditd.conf /etc/sysctl.d/99-hardening-process.conf"
          before=$(docker exec db-harden-node sha256sum $files)
          docker exec db-harden-node bash /root/harden.sh \
            --admin-user opsadmin \
            --pubkey "$(cat test/.ssh_ci/id_ci.pub)" -y
          after=$(docker exec db-harden-node sha256sum $files)
          if [ "$before" != "$after" ]; then
            echo "::error::harden.sh is not idempotent — config changed on the second run"
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi
          echo "Idempotent: config unchanged on the second run."

      - name: Verify the hardening from the outside
        run: ./test/verify.sh

      - name: Tear the node down
        if: always()
        run: ./test/node.sh down

      # Independent of the node above: hardens fresh throwaway containers with
      # different flag sets and asserts each behaves (lockout guard, custom
      # port, extra ports, skipping a step).
      - name: Scenario tests (flag behaviour)
        run: ./test/scenarios.sh
