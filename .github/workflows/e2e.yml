name: e2e

# The real proof: boot a disposable Debian "server" (systemd container), run
# harden.sh inside it for real, run it again to prove idempotence, then verify
# every promise from the outside over SSH. Linting checks the script parses;
# this checks it actually hardens.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harden-and-verify:
    name: Harden a disposable Debian node + verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Boot the test node
        run: ./test/node.sh up && ./test/node.sh wait

      # CIS 6.1 offenders planted BEFORE hardening: a world-writable file, an
      # orphan owned by a UID that doesn't exist, and a 777 dir without the
      # sticky bit. The file-permissions sweeps must fix all three — verify's
      # checks flip from red to green because of these, not by vacuum.
      - name: Plant file-permission offenders for the first pass to fix
        run: |
          docker exec db-harden-node bash -c "
            install -d -m 777 /usr/local/share/dh-ww-dir &&
            touch /usr/local/share/dh-ww-file && chmod 666 /usr/local/share/dh-ww-file &&
            touch /usr/local/share/dh-orphan && chown 12345:12345 /usr/local/share/dh-orphan"

      # CIS 5.4.2 / 6.2.9 offender: a service account with a REAL shell and a
      # usable password — exactly what a packaged daemon leaves behind, and a
      # valid su / SSH target. The system-accounts step must take both away,
      # so verify's checks flip from red to green because of this account.
      - name: Plant a system account with a login shell for step 25 to lock
        run: |
          docker exec db-harden-node bash -c "
            useradd --system --shell /bin/bash --create-home dhsvc &&
            echo 'dhsvc:Plant3d!Svc#2026' | chpasswd"

      # CIS 4.2.3 offenders: a world-readable log file, and rsyslog.conf's own
      # FileCreateMode drifted to 0644 (one careless edit away on any box).
      # The log-permissions step must sweep the file to 0640 AND re-impose
      # 0640 on newly created logs via its drop-in — verify deletes syslog and
      # proves the reborn file's mode, so this flips red to green for real.
      - name: Plant log-permission offenders for step 26 to fix
        run: |
          docker exec db-harden-node bash -c "
            touch /var/log/dh-app.log && chmod 666 /var/log/dh-app.log &&
            sed -i 's/^\\\$FileCreateMode 0640/\\\$FileCreateMode 0644/' /etc/rsyslog.conf"

      # CIS 4.4 offender: a logrotate snippet that re-creates its log 0666.
      # Stock Debian already offends on its own (bare global create, dpkg and
      # alternatives at 644) — this one is the evergreen guarantee should the
      # distro ever clean up: the logrotate-perms step must tighten it to
      # 0640 while keeping the owner/group arguments untouched.
      - name: Plant a logrotate offender for step 27 to tighten
        run: |
          docker exec db-harden-node bash -c "
            touch /var/log/dh-rotated.log &&
            printf '/var/log/dh-rotated.log {\n  weekly\n  rotate 2\n  create 0666 root adm\n}\n' > /etc/logrotate.d/dh-rotated"

      # CIS 6.2 offender: an interactive user whose home is 755 — the default
      # many distros still ship — carrying the two legacy dotfiles that grant
      # access with no password (.netrc holds cleartext logins, .forward
      # reroutes mail). The home-permissions step must tighten the mode AND
      # remove both relics — verify's checks flip from red to green for real.
      - name: Plant a loose interactive home for step 29 to tighten
        run: |
          docker exec db-harden-node bash -c "
            useradd --create-home --shell /bin/bash dhhome &&
            chmod 755 /home/dhhome &&
            printf 'machine example.com login dh password hunter2\n' > /home/dhhome/.netrc &&
            printf 'dh@elsewhere.example\n' > /home/dhhome/.forward &&
            chown dhhome:dhhome /home/dhhome/.netrc /home/dhhome/.forward"

      # Step 30 offender: /proc mounted WITHOUT hidepid (the stock state) and
      # ptrace_scope forced back to 0. The second half matters — this WSL /
      # runner kernel already ships ptrace_scope=1, so without planting the 0
      # the check would pass without the step doing anything (tautological).
      - name: Plant open process visibility for step 30 to close
        run: |
          docker exec db-harden-node bash -c "
            mount -o remount,hidepid=0 /proc &&
            sysctl -qw kernel.yama.ptrace_scope=0 &&
            findmnt -no OPTIONS /proc &&
            sysctl -n kernel.yama.ptrace_scope"

      # Step 31 offenders: the guess-cost knobs pinned to their WEAK values —
      # an explicit cost factor 5 (what stock yescrypt uses implicitly) and
      # FAIL_DELAY 0. The stock file carries NEITHER key, so planting them
      # forces the step through its reconcile path (sed, not append) and the
      # login.defs checks flip red→green because real drift got rewritten.
      - name: Plant weak guess-cost values for step 31 to reconcile
        run: |
          docker exec db-harden-node bash -c "
            printf 'YESCRYPT_COST_FACTOR\t5\nFAIL_DELAY\t0\n' >> /etc/login.defs &&
            grep -E '^(YESCRYPT_COST_FACTOR|FAIL_DELAY)' /etc/login.defs"

      # Step 32 offenders, planted in ALL THREE sources that set root's PATH
      # on Debian (login.defs, /etc/profile — which OVERWRITES login.defs for
      # login shells — and /etc/crontab). Two kinds on purpose, because the
      # step treats them differently and that distinction IS the promise:
      #   - fixable: /opt/dh-path-loose (exists, world-writable) and a
      #     loosened /usr/local/bin — both must come back TIGHTENED and still
      #     in the PATH. Deleting a directory the admin put there would break
      #     locally installed binaries; the step fixes what it can.
      #   - unfixable: an empty entry (= the current directory), a bare '.',
      #     and /opt/dh-path-gone which does not exist — these must vanish.
      - name: Plant PATH traps for step 32 to sanitize
        run: |
          docker exec db-harden-node bash -c "
            install -d -m 777 /opt/dh-path-loose &&
            chmod 777 /usr/local/bin &&
            sed -i 's|^ENV_SUPATH.*|ENV_SUPATH\tPATH=/opt/dh-path-loose:/opt/dh-path-gone:/usr/local/sbin::/usr/local/bin:.:/usr/sbin:/usr/bin:/sbin:/bin|' /etc/login.defs &&
            sed -i '5s|PATH=\"[^\"]*\"|PATH=\"/opt/dh-path-loose:/opt/dh-path-gone:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:\"|' /etc/profile &&
            sed -i 's|^PATH=.*|PATH=/opt/dh-path-gone:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin|' /etc/crontab &&
            grep -E '^ENV_SUPATH' /etc/login.defs && sed -n 5p /etc/profile"

      # Step 34 offenders: a LAX pwhistory profile (remember=3, and no
      # enforce_for_root — measured: without it a reuse performed by root
      # prints the warning and goes through anyway) plus a loosened opasswd.
      # The stock system carries no profile at all, so planting one forces
      # the step through its overwrite path, and 0644 on a file of password
      # hashes is exactly the drift the chmod must undo.
      - name: Plant a lax password-history profile for step 34 to overwrite
        run: |
          docker exec db-harden-node bash -c "
            printf 'Name: Password history (lax)\nDefault: yes\nPriority: 512\nPassword-Type: Primary\nPassword:\n\trequisite\t\t\tpam_pwhistory.so remember=3 use_authtok\n' > /usr/share/pam-configs/hardening-pwhistory &&
            chmod 644 /etc/security/opasswd &&
            stat -c '%a' /etc/security/opasswd && cat /usr/share/pam-configs/hardening-pwhistory"

      # Step 35 offender: an explicit weak-crypto line in the MAIN sshd
      # config — the "legacy client compat" line every fleet has somewhere.
      # Debian includes sshd_config.d at the TOP of sshd_config and sshd
      # honours the FIRST occurrence of a keyword, so the step's drop-in
      # must beat this line: planting it proves the PRECEDENCE, not just
      # the file contents (and stock offers hmac-sha1 anyway — this keeps
      # the check meaningful the day upstream retires it).
      - name: Plant a weak-crypto line for step 35 to override
        run: |
          docker exec db-harden-node bash -c "
            printf 'MACs hmac-sha2-256,hmac-sha1\nKexAlgorithms ecdh-sha2-nistp256,curve25519-sha256\n' >> /etc/ssh/sshd_config &&
            sshd -t && tail -2 /etc/ssh/sshd_config"

      # Step 36 offenders: a legacy client and a legacy superserver apt can
      # still install on Debian 13 — and `telnet` is the transitional trap
      # (a dummy package whose payload is inetutils-telnet via
      # update-alternatives: purging the dummy alone leaves /usr/bin/telnet
      # working). The purge must take the whole pair AND xinetd away.
      - name: Plant legacy protocol packages for step 36 to purge
        run: |
          docker exec db-harden-node bash -c "
            apt-get install -y --no-install-recommends telnet xinetd >/dev/null &&
            command -v telnet && dpkg-query -W telnet inetutils-telnet xinetd"

      - name: "First pass: run harden.sh inside the node (as root)"
        run: |
          docker exec db-harden-node bash /root/harden.sh \
            --admin-user opsadmin \
            --pubkey "$(cat test/.ssh_ci/id_ci.pub)" -y

      - name: "Second pass: idempotence (config files must not change)"
        run: |
          files="/etc/ssh/sshd_config.d/99-hardening.conf /etc/fail2ban/jail.local /etc/apt/apt.conf.d/20auto-upgrades /etc/sysctl.d/99-hardening.conf /etc/login.defs /etc/default/useradd /etc/fstab /etc/issue /etc/issue.net /etc/motd /etc/ssh/sshd_config.d/98-banner.conf /etc/sudoers.d/99-hardening-sudo /etc/ssh/sshd_config.d/97-hardening-policies.conf /etc/security/limits.d/99-hardening-coredumps.conf /etc/systemd/coredump.conf.d/99-hardening.conf /etc/profile.d/99-hardening-umask.sh /etc/profile.d/99-hardening-tmout.sh /etc/cron.allow /etc/security/pwquality.conf /etc/aide/hardening.conf /etc/systemd/system/aide-check.timer /etc/default/rkhunter /etc/systemd/system/rkhunter-check.timer /etc/modprobe.d/99-hardening-blacklist.conf /etc/security/faillock.conf /etc/pam.d/su /etc/passwd /etc/rsyslog.d/99-hardening.conf /etc/logrotate.conf /etc/logrotate.d/dpkg /etc/logrotate.d/dh-rotated /etc/audit/rules.d/hardening.rules /etc/audit/auditd.conf /etc/sysctl.d/99-hardening-process.conf /usr/share/pam-configs/hardening-faildelay /etc/pam.d/common-auth /etc/profile /etc/crontab /usr/share/pam-configs/hardening-pwhistory /etc/pam.d/common-password /etc/security/opasswd /etc/ssh/sshd_config.d/95-hardening-crypto.conf"
          before=$(docker exec db-harden-node sha256sum $files)
          docker exec db-harden-node bash /root/harden.sh \
            --admin-user opsadmin \
            --pubkey "$(cat test/.ssh_ci/id_ci.pub)" -y
          after=$(docker exec db-harden-node sha256sum $files)
          if [ "$before" != "$after" ]; then
            echo "::error::harden.sh is not idempotent — config changed on the second run"
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi
          echo "Idempotent: config unchanged on the second run."

      - name: Verify the hardening from the outside
        run: ./test/verify.sh

      - name: Tear the node down
        if: always()
        run: ./test/node.sh down

      # Independent of the node above: hardens fresh throwaway containers with
      # different flag sets and asserts each behaves (lockout guard, custom
      # port, extra ports, skipping a step).
      - name: Scenario tests (flag behaviour)
        run: ./test/scenarios.sh
